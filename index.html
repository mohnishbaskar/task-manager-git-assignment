<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>My Task Manager</h1>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task Manager</h1>
        <p>Organize your daily  tasks efficiently</p>
    </header>

    <main>
        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="task">
                <span>Complete Git Assignment</span>
                <span class="priority">High</span>
            </div>

            <div class="task">
                <span>Study for Examination</span>
                <span class="priority">Medium</span>
            </div>

            <div class="task">
                <span>Work on Project</span>
                <span class="priority">Low</span>
            </div>
        </section>
    </main>

    <footer>
        <p>Task Manager © 2026</p>
    </footer>

</body>
</html>
